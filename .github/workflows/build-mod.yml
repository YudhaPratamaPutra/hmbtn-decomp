name: Build Mod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download original disc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-disc"
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "baserom.bin" \
            --dir "$RUNNER_TEMP/original-disc"
          test -s "$RUNNER_TEMP/original-disc/baserom.bin"

      - name: Build the image
        run: docker build -t hmbtn-build .

      - name: Build mod
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "$PWD":/src
          -v "$RUNNER_TEMP/original-disc:/disc:ro"
          -w /src hmbtn-build
          bash -c 'cmake -S . -B build -G Ninja
          -DORIGINAL_DISC=/disc/baserom.bin &&
          cmake --build build --target disc'

      - name: Upload mod disc
        uses: actions/upload-artifact@v4
        with:
          name: hmbtn-mod
          path: |
            build/disc.bin
            build/disc.cue
          if-no-files-found: error
